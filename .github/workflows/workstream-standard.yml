name: Canonical workstream CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    - cron: "23 4 * * 6"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: workstream-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, ci-isolated]
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run canonical Dagger pipeline
        uses: ./.github/actions/workstream-ci
        with:
          category: "research"

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5
        with:
          advanced-security: false
          online-audits: false
          annotations: true
          min-severity: high
          min-confidence: high
          version: v1.28.0
