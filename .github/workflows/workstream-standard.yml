name: Canonical workstream CI

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - closed
  schedule:
    - cron: "23 4 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: workstream-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  lanes:
    if: github.event.pull_request.draft != true && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'emergency')))
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/lanes-local.yml
    with:
      category: "research"
      lane-config: '{"codePaths":["*.py","figures/source/**"],"recordPaths":["CITATION.cff"]}'
      runner: '"ubuntu-24.04"'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  required:
    name: required
    if: always() && github.event.action != 'closed'
    needs: lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the lane result
        env:
          RESULT: ${{ needs.lanes.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          echo "lanes: $RESULT"
          [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$DRAFT" = true ]; }
