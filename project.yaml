workstream:
  version: 1
  name: growth-tunnel-analysis
  category: research
  outcome: Produce a reproducible growth-tunnel scaffold characterisation analysis
    and paper.
  repository: andtoni/growth-tunnel-analysis
  lifecycle: active
  runtime:
    authority: none
  ci:
    fullOnPaths:
    - project.yaml
    - .github/**
    - '*lock*'
    - '**/*lock*'
    noNativePaths:
    - docs/**
    - '*.md'
    - '**/*.md'
    - artifacts/**
    trivySkipDirs:
    - scripts/legacy
    lanes:
    - name: research
      image: ghcr.io/astral-sh/uv:0.8.13-python3.13-bookworm-slim@sha256:020e9eefae64e99ea2da39bcd1af1294be0a0b01e98ebad4dbedfd8b729500f7
      paths:
      - src/**
      - scripts/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - verify_environment.py
      - 0*.py
      setupCommands: []
      pullRequestCommands:
      - uv lock --check
      - uv sync --extra dev
      - uv run python -m compileall -q scripts/check_project.py verify_environment.py
        0*.py
      fullCommands: []
  research:
    rawData: /home/andto/Nextcloud/Work/PhD/Projects/growth-tunnel-analysis
