project:
  slug: growth-tunnel-analysis
  title: "Growth Tunnel Analysis"
  profile: imaging-paper
  target_journal: "Materials Today Bio (published 2026, doi:10.1016/j.mtbio.2026.103377)"
  timezone: Africa/Johannesburg
  canonical_remote: https://github.com/andtoni/growth-tunnel-analysis.git

locations:
  code_repo: growth-tunnel-analysis
  project_material: $GTA_MATERIAL
  rule: "Keep Git code in code_repo; keep raw data, manuscript artefacts, Prism projects, and generated outputs in project_material."

data_roots:
  - label: transmural_3d_analysis_archive
    path: $GTA_MATERIAL/Original/transmural-space-characterisation-3d-analysis-paper
    immutable: true
    tracked_by: external-nextcloud
    contents: "Micro-CT/PNM/porosity/tortuosity/permeability/viscosity/thermal/figure material and generated outputs."
  - label: paper_2_manuscript_extra_analysis
    path: $GTA_MATERIAL/Original/paper-2-manuscript-and-extra-analysis
    immutable: true
    tracked_by: external-nextcloud
    contents: "Manuscript files, extra analysis, mechanical raw files, mechanical data summary, Prism project, figure panels."
  - label: system_coding_mirror_legacy
    path: $GTA_MATERIAL/_legacy/system-coding-mirror
    immutable: true
    tracked_by: external-nextcloud
    contents: "Original migration-era stablePNM, confocalPorosity, and ImageJ macro folders after code copies were filed into Git."
  - label: mtbio_revision_package_2026_06
    path: $GTA_MATERIAL/Manuscript/mtbio-d-26-02595-revision-package-2026-06
    immutable: true
    tracked_by: external-nextcloud
    contents: "Full MTBIO-D-26-02595 manuscript revision package: v1/v2/v3 manuscripts, tracked/clean files, reviewer comments, point-by-point responses, cover letters, final figure PDFs, graph SVGs, Prism projects, statistical XML exports, and figure raw-data workbooks."

code_sources:
  active_pipeline:
    - 01_run_snow2.py
    - 02_run_network_analysis.py
    - 03_run_paraview_batch.py
    - 04_quantification_export.py
    - 05_pnm_data_export.py
    - verify_environment.py
  legacy_filed:
    - scripts/legacy/stablePNM
    - scripts/legacy/confocal-porosity/confocal_porosity.py
    - scripts/legacy/imagej
    - scripts/legacy/mechanical/InstronAnalysis.bas
    - figures/source/paraview/p16SR.legacy-system.pvsm

critical_material:
  mechanical:
    summary: $GTA_MATERIAL/Original/paper-2-manuscript-and-extra-analysis/Extra Analysis/Mechanical Data Summary.xlsx
    raw_dir: $GTA_MATERIAL/Original/paper-2-manuscript-and-extra-analysis/Extra Analysis/Mechanical
    vba: scripts/legacy/mechanical/InstronAnalysis.bas
    table_docx: $GTA_MATERIAL/Original/paper-2-manuscript-and-extra-analysis/Extra Analysis/Table for Mechanical Properties.docx
    svg_table: $GTA_MATERIAL/Original/paper-2-manuscript-and-extra-analysis/Extra Analysis/mechanical_anisotropy_svg_table.svg
  confocal_porosity:
    script: scripts/legacy/confocal-porosity/confocal_porosity.py
    output: $GTA_MATERIAL/Original/transmural-space-characterisation-3d-analysis-paper/Porosity/Confocal/porosity_output
  pore_network:
    quantification_workbook: $GTA_MATERIAL/Original/transmural-space-characterisation-3d-analysis-paper/codeoutput/Pore_Network_Quantification.xlsx
    prism_grouped_workbook: $GTA_MATERIAL/Original/transmural-space-characterisation-3d-analysis-paper/codeoutput/PNM_Prism_Grouped.xlsx
  manuscript_revision:
    package: $GTA_MATERIAL/Manuscript/mtbio-d-26-02595-revision-package-2026-06
    latest_clean_manuscript: $GTA_MATERIAL/Manuscript/mtbio-d-26-02595-revision-package-2026-06/paper2_v3_clean.docx
    latest_tracked_manuscript: $GTA_MATERIAL/Manuscript/mtbio-d-26-02595-revision-package-2026-06/paper2_v3_tracked.docx
    latest_response_to_reviewers: $GTA_MATERIAL/Manuscript/mtbio-d-26-02595-revision-package-2026-06/detailedreviewerresponses_v3.docx
    latest_cover_letter: $GTA_MATERIAL/Manuscript/mtbio-d-26-02595-revision-package-2026-06/coverletter_v3.docx
    original_reviewer_comments: $GTA_MATERIAL/Manuscript/mtbio-d-26-02595-revision-package-2026-06/Reviewer Comments Original.docx
    checksum_manifest: $GTA_MATERIAL/Manuscript/manifests/mtbio-d-26-02595-revision-package-2026-06.sha256

workflow:
  check: make check
  install_pipeline_dependencies: uv sync --extra pipeline
  verify_environment: uv run --extra pipeline python verify_environment.py
