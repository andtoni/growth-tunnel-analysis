[project]
name = "growth-tunnel-analysis"
version = "0.1.0"
description = "Pore-network, confocal porosity, and mechanical analysis workflow for porous biomaterial scaffold characterisation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
pipeline = [
  "imageio==2.37.4",
  "matplotlib==3.9.0",
  "networkx>=3.0",
  "numpy==1.26.4",
  "openpnm==3.3.0",
  "openpyxl==3.1.2",
  "pandas==2.2.0",
  "porespy==2.2.0",
  "pypardiso==0.4.6",
  "scikit-image==0.22.0",
  "scipy==1.13.1",
  "tqdm==4.66.3",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
